    <title>Polar Agent</title>
    <script>
      // Apply host-provided page attributes before first paint to avoid flashes.
      // The native shell injects ?theme=light|dark and ?surface=...; defaults are
      // dark/window.
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var t = params.get('theme');
          var surface = params.get('surface');
          document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
          document.documentElement.dataset.surface =
            surface === 'command-panel' || surface === 'modal' ? surface : 'window';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.dataset.surface = 'window';
        }
      })();
    </script>

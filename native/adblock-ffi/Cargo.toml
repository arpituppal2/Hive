[package]
name = "hive-adblock-ffi"
version = "0.1.0"
edition = "2021"
description = "C FFI wrapper around Brave's adblock-rust for Hive Browser"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "hive_adblock_ffi"

[dependencies]
adblock = "0.13"
once_cell = "1"
rmp = "~0.8"
rmp-serde = "0.15"
url = "2"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

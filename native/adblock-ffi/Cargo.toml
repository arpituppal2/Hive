[package]
name = "hive-adblock-ffi"
version = "0.1.0"
edition = "2021"
description = "C FFI wrapper around Brave's adblock-rust for Hive Browser"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "hive_adblock_ffi"

[dependencies]
# Disable default features to drop `single-thread`: that feature makes
# adblock::Engine !Send + !Sync, but the FFI engine must be readable from
# both the main actor and CEF's IO thread via a shared Mutex. Keep the two
# functional default features (domain resolution + full regex handling).
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
once_cell = "1"
rmp = "~0.8"
rmp-serde = "0.15"
url = "2"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
